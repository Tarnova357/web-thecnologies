<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 7.3</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<form class="form">
  <h1 class="form-title">Заповніть форму<span>Ми вдячні вам</span></h1>

  <div class="form-row">
    <div class="form-group align-left">
      <label class="form-label" for="login">Login</label>
      <input class="form-input form-input-text" type="text" id="login" name="login">
    </div>
    <div class="form-group align-right">
      <label class="form-label" for="email">Email</label>
      <input class="form-input form-input-email" type="email" id="email" name="email">
    </div>
  </div>

  <div class="form-row">
    <div class="form-group align-left">
      <label class="form-label" for="password">Password</label>
      <input class="form-input form-input-password" type="password" id="password" name="password">
    </div>
    <div class="form-group align-right">
      <label class="form-label" for="password-repeat">Repeat password</label>
      <input class="form-input form-input-password" type="password" id="password-repeat" name="password-repeat">
    </div>
  </div>

  <div class="form-row">
    <div class="form-group align-left">
      <label class="form-label" for="first-name">First Name</label>
      <input class="form-input form-input-text" type="text" id="first-name" name="first-name">
    </div>
    <div class="form__group align-right">
      <label class="form-label" for="last-name">Last Name</label>
      <input class="form-input form-input-text" type="text" id="last-name" name="last-name">
    </div>
  </div>

  <div class="form-row">
    <div class="form-group form-group-full-width">
      <label class="form-label align-left" for="about-me">About me</label>
      <textarea class="form-textarea" id="about-me" name="about-me"></textarea>
    </div>
  </div>

  <div class="form-row form-row-buttons">
    <button class="button button-submit align-right" type="submit">OK</button>
    <button class="button button-reset align-right" type="reset">Reset</button>

  </div>

</form>

</body>
</html>
